name: Release Module

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Corepack
        run: corepack enable

      - name: Install Dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Run MVP Verification Gate
        run: corepack pnpm mvp:verify

      - name: Check Manual Release Readiness
        run: corepack pnpm release:ready

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # The manifest Foundry polls is the one the site serves, built from main.
      # Writing the tag's version into a copy here would ship a zip that says one
      # version while every installed module is offered another, so the committed
      # manifest is checked instead of rewritten.
      - name: Check the committed manifest carries the tag's version
        run: |
          COMMITTED=$(node -p "require('./apps/foundry-module/module.json').version")
          if [ "$COMMITTED" != "${{ steps.get_version.outputs.VERSION }}" ]; then
            echo "apps/foundry-module/module.json says $COMMITTED, tag says ${{ steps.get_version.outputs.VERSION }}."
            exit 1
          fi

      - name: Create release ZIP
        run: corepack pnpm foundry:package ./release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release/bertinis-vault.zip
          body_path: CHANGELOG.md
          generate_release_notes: false
          draft: false
          prerelease: false
