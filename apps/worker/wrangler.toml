name = "bertinis-vault"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Declared, and not a default. Adding the route below turns `workers.dev` off
# unless this says otherwise, and the deployed builder and every installed copy
# of the Foundry module still ask `bertinis-vault.bertinisdnd.workers.dev` for
# a build. Dropping it took the store offline for both until this line existed.
#
# It stays until no module in the wild is still pointing at that address, which
# is not a thing this repository can know.
workers_dev = true

# Builds stored by code. Create with:
#   wrangler kv namespace create BUILDS
[[kv_namespaces]]
binding = "BUILDS"
id = "fee3b01501c04a439392fdaf962659fb"

# Accounts, sessions and saved characters. Apply the schema with:
#   wrangler d1 migrations apply alba --remote
#
# The binding is `DB`, not the database name. `wrangler d1 create` suggests
# naming it after the database; the Worker reads `env.DB`.
[[d1_databases]]
binding = "DB"
database_name = "alba"
database_id = "78d58d4d-bfb8-40e2-ae04-6687d4146b57"

[vars]
# The wildcard stays, with the site's own name beside it. Both are needed and
# they do different jobs: the name is what lets the page hold a session, and
# the wildcard is what lets a Foundry world on any host read a build.
#
# Dropping the wildcard would leave `corsHeaders` answering every other origin
# with the first entry in this list, which a browser reads as a mismatch — and
# the module's import would stop working from every Foundry install.
ALLOWED_ORIGINS = "*,https://alba.bertinilabs.xyz"

APP_ORIGIN = "https://alba.bertinilabs.xyz"

# This Worker's own address, as Discord has it registered.
#
# Not derived from the request: the Worker answers to two names and only this
# one is registered with Discord, so a sign-in that started on `workers.dev`
# sent a `redirect_uri` Discord had never seen and got "Invalid OAuth2
# redirect_uri". The same name is the only one that can set a cookie scoped to
# COOKIE_DOMAIN, so it is where the sign-in has to happen either way.
AUTH_ORIGIN = "https://api.bertinilabs.xyz"
COOKIE_DOMAIN = "bertinilabs.xyz"
DISCORD_CLIENT_ID = "1544171626973892688"

# The secret is never in this file:
#   wrangler secret put DISCORD_CLIENT_SECRET

# The Worker answers to its own name under the site's domain, which is what
# lets the session cookie travel: a browser only sends one between addresses
# that share a registrable domain, and `workers.dev` shares none with the page.
#
# A custom domain creates the DNS record and the certificate on deploy. It also
# has to exist, because the zone carries a wildcard `*` A record pointing at
# Vercel — without this, `api.bertinilabs.xyz` resolves to the front and
# answers 404 rather than failing in a way anyone would recognise as DNS.
[[routes]]
pattern = "api.bertinilabs.xyz"
custom_domain = true

# The budget of wrong codes a caller gets, counted at the edge.
#
# A code is now eight alternating characters — 4.569.760.000 of them, against
# the 1.126 billones the ten-character base32 scheme had. That is enough for
# every character anyone will ever build and not enough to leave enumeration
# purely to arithmetic, so a caller gets thirty misses a minute and nothing
# after that. Successful reads never touch this: `handler.ts` only spends the
# budget on a read that failed.
#
# Cloudflare counts this in its own edge state rather than in KV, which matters:
# a counter in KV would spend one of the day's thousand writes on every wrong
# guess, and the cheapest way to take the store down would be to ask it for
# codes that do not exist.
[[ratelimits]]
name = "READ_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Publishing is anonymous and owned builds never expire: ten a minute per caller
# is far above a player re-sending a sheet and far below filling the store.
[[ratelimits]]
name = "WRITE_LIMIT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
