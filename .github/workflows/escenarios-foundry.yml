name: Escenarios Foundry (temporal)

on:
  push:
    branches:
      - chore/validacion-foundry

jobs:
  payloads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm packages:build
      - name: Build payloads
        working-directory: apps/web
        run: |
          corepack pnpm exec vite build --ssr probes/escenarios.ts --outDir .probe
          node .probe/escenarios.js "$GITHUB_WORKSPACE/escenarios.json"
      - uses: actions/upload-artifact@v4
        with:
          name: escenarios
          path: escenarios.json
